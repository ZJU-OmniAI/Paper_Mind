<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>收藏论文</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main class="popup">
      <header>
        <div class="heading">
          <h1 id="popupTitle">收藏论文</h1>
          <p id="serverStatus">读取本地论文库…</p>
        </div>
        <div class="header-actions">
          <select id="languageSelect" title="语言">
            <option value="zh">中文</option>
            <option value="en">EN</option>
          </select>
          <button id="reloadButton" type="button" title="重新读取当前页面">↻</button>
          <button id="openManagerButton" type="button" title="打开管理页">管理</button>
        </div>
      </header>

      <div class="saved-banner" id="savedBanner" hidden>
        <p class="saved-banner-text" id="savedBannerText"></p>
        <p class="saved-banner-tags" id="savedBannerTags" hidden></p>
        <div class="saved-banner-actions">
          <button type="button" id="savedOpenButton">在管理页查看</button>
          <button type="button" id="savedCreateNewButton">仍要新建一篇</button>
        </div>
      </div>

      <form id="paperForm">
        <label>
          <span id="titleLabel">论文标题</span>
          <textarea id="titleInput" rows="2" required spellcheck="false"></textarea>
        </label>

<section class="bibliography-editor" id="captureBibliography"></section>
<div class="memory-fields"><label><span data-zh="一句话记住它" data-en="Remember it in one sentence"></span><textarea id="captureMemory" name="memory" rows="2" maxlength="280" data-placeholder-zh="例如：用检索到的证据，让智能体读论文时少编造。" data-placeholder-en="E.g. Ground paper-reading agents in retrieved evidence." placeholder="例如：用检索到的证据，让智能体读论文时少编造。"></textarea></label><label><span data-zh="阅读状态" data-en="Reading status"></span><select id="captureReadingStatus" name="readingStatus" data-reading-status><option value="unread">未读</option><option value="reading">在读</option><option value="read">已读</option><option value="revisit">待重读</option></select></label></div>
        <label class="value-score-field">
          <span id="valueScoreLabel">价值评分</span>
          <strong id="valueScoreText">3分=热点引领</strong>
          <input id="valueScoreInput" type="range" min="1" max="5" step="0.5" value="3" />
        </label>

        <div class="clip-panel" id="clipPanel" hidden>
          <div class="clip-head">
            <label class="clip-toggle">
              <input type="checkbox" id="clipEnabledInput" />
              <span id="clipToggleLabel">保存网页正文</span>
            </label>
            <button type="button" class="clip-preview-button" id="clipPreviewButton">预览</button>
          </div>
          <p class="clip-stats" id="clipStats"></p>
          <pre class="clip-preview" id="clipPreview" hidden></pre>
        </div>

        <div class="merge-panel" id="mergePanel" hidden>
          <p class="merge-text" id="mergeText"></p>
          <div class="merge-actions">
            <button type="button" class="merge-choice active" id="mergeChoiceMerge">并入这篇</button>
            <button type="button" class="merge-choice" id="mergeChoiceNew">单独保存</button>
          </div>
        </div>

        <label>
          <span id="abstractLabel">摘要</span>
          <textarea id="abstractInput" rows="4"></textarea>
        </label>

        <label>
          <span class="notes-heading"><span id="notesLabel">备注 / 对话记录</span><button type="button" id="pasteNotesButton">粘贴剪贴板</button></span>
          <textarea id="conversationInput" rows="3"></textarea>
        </label>

        <div class="tag-section">
          <span class="field-label" id="tagsLabel">标签</span>
          <div class="tag-box-wrap">
            <div class="tag-box" id="tagBox">
              <input id="tagInput" autocomplete="off" placeholder="输入或搜索标签，回车添加" />
            </div>
            <div class="tag-suggestions" id="tagSuggestions" hidden></div>
          </div>
          <p class="tag-policy-note" id="tagPolicyNote"></p>
          <div class="quick-tags" id="quickTags" hidden>
            <span class="quick-tags-label" id="quickTagsLabel">全部标签</span>
            <div class="quick-tags-list" id="quickTagsList"></div>
          </div>
        </div>

        <div class="duplicate-panel" id="duplicatePanel" hidden>
          <p class="duplicate-text" id="duplicateText"></p>
          <p class="duplicate-tags" id="duplicateTagsLine" hidden></p>
          <div class="duplicate-actions">
            <button type="button" id="dupCreateButton">仍然新建</button>
            <button type="button" id="dupCancelButton">取消</button>
          </div>
        </div>

        <button class="primary" id="saveButton" type="submit">保存到论文库</button>
      </form>

      <div id="message" class="message" role="status" aria-live="polite"></div>
    </main>
    <script src="popup.js" type="module"></script>
  </body>
</html>
