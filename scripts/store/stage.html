<!doctype html><html lang="en"><meta charset="utf-8"><title>Paper_Mind store artwork</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#ecf3ef;color:#163e37;font-family:Arial,"PingFang SC","Microsoft YaHei",sans-serif}#stage{width:1280px;height:800px;position:relative;overflow:hidden;background:radial-gradient(ellipse at 95% 0,#cfebe1,transparent 50%),#f5f7f2;padding:32px 44px}.brand{display:flex;align-items:center;gap:10px;font-size:20px;font-weight:700;letter-spacing:-.5px}.brand img{width:30px;height:30px}.index{position:absolute;right:46px;top:39px;font-size:12px;letter-spacing:2px;color:#557b70}h1{font-size:43px;line-height:1.13;letter-spacing:-1.4px;margin:23px 0 11px;max-width:1160px}#subtitle{font-size:19px;color:#5b766b;margin:0;line-height:1.4}#content{position:absolute;top:193px;bottom:56px;left:44px;right:44px;display:flex;align-items:center;justify-content:center;gap:24px}.card{background:#fff;border:1px solid #d3e2db;border-radius:17px;box-shadow:0 12px 25px #284a3a0b;padding:18px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;overflow:hidden;max-height:100%}.card.wide{width:100%;height:100%}.card.half{width:50%;height:100%;padding:18px 24px}.card.narrow{width:38%;height:100%}.card.rest{flex:1;height:100%}.label{align-self:flex-start;font-size:13px;letter-spacing:1px;font-weight:700;color:#568176;text-transform:uppercase}.ui{display:block;max-width:100%;max-height:100%;object-fit:contain}.card.wide .ui{max-height:480px}.card.half .ui{max-width:410px}.stack{display:flex;flex-direction:column;gap:14px;align-items:center;width:100%;min-height:0}.stack .ui{max-height:225px}.legend{font-size:19px;line-height:1.6;color:#285f52;text-align:left;max-width:365px}.footer{position:absolute;bottom:21px;left:46px;font-size:12px;color:#698276;max-width:1120px}.accent{color:#078878}.route{display:flex;align-items:center;justify-content:center;gap:16px;margin:15px 0;font-size:19px}.pill{background:#e4f4ee;border-radius:99px;padding:12px 18px;color:#08786b;font-weight:700}.arrow{color:#7aa590;font-size:22px}
</style>
<div id="stage"><div class="brand"><img src="/assets/logo.png" alt="">Paper_Mind</div><div class="index" id="index"></div><h1 id="headline"></h1><p id="subtitle"></p><div id="content"></div><div class="footer" id="footer"></div></div>
<script>
window.render=({lang,index,title,subtitle,html})=>{document.documentElement.lang=lang==='zh'?'zh-CN':'en';document.querySelector('#index').textContent=`${String(index).padStart(2,'0')} / 05`;document.querySelector('#headline').textContent=title;document.querySelector('#subtitle').textContent=subtitle;document.querySelector('#content').innerHTML=html;document.querySelector('#footer').textContent=lang==='zh'?'实际界面局部 · 隔离示例数据 · AI 说明为预置演示内容':'Actual interface details · Isolated sample data · AI descriptions are prewritten examples';};
</script></html>
