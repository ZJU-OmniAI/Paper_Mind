<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>Paper_Mind 功能介绍录制</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:1920px;height:1080px;overflow:hidden}body{font-family:"PingFang SC",-apple-system,BlinkMacSystemFont,sans-serif;background:#f1f5f2;color:#173b35}
body:before{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at 95% 8%,#c6e9e066,transparent 50%),linear-gradient(120deg,transparent 65%,#e0ece766);pointer-events:none}
header{position:absolute;left:60px;top:26px;right:60px;display:flex;align-items:center;justify-content:space-between;height:58px}header .brand{display:flex;gap:17px;align-items:center;font-size:29px;font-weight:700;letter-spacing:.5px}header img{width:50px;height:50px;object-fit:contain}header .badge{border:1px solid #cadad3;border-radius:40px;padding:10px 18px;color:#61776f;font-size:18px;letter-spacing:1px;background:#ffffff77}
#section{position:absolute;left:65px;top:102px;font-size:20px;color:#0c7d72;font-weight:600;letter-spacing:1px}#title{position:absolute;left:65px;top:141px;margin:0;font-size:42px;font-weight:700;line-height:1.32;white-space:pre-line;letter-spacing:-1px}#kicker{position:absolute;left:65px;top:357px;font-size:26px;color:#5c756c;line-height:1.6;white-space:pre-line;max-width:760px}
#flow{position:absolute;left:65px;top:490px;display:flex;gap:16px;align-items:center}#flow span{font-size:24px;letter-spacing:.5px;padding:18px 23px;border-radius:14px;border:1px solid #cbdcd4;background:#fff9}#flow span:first-child{border-color:#9dcfc0;background:#e4f4ed;color:#0c7d72}#flow b{color:#85ac9d;font-size:26px}
#minor{position:absolute;left:65px;bottom:215px;max-width:690px;line-height:1.8;color:#7a8d84;font-size:21px}#minor strong{color:#547269;font-weight:500}
#viewer{position:absolute;top:197px;left:60px;width:1800px;height:711px;border:1px solid #bcd5ca;border-radius:18px;background:#fff;box-shadow:0 18px 50px #29534713;overflow:hidden;opacity:1}#browserbar{height:34px;background:#e6eee9;border-bottom:1px solid #d9e4dc;display:flex;align-items:center;gap:6px;padding:0 15px;color:#6a7e75;font-size:13px}#browserbar i{height:8px;width:8px;border-radius:50%;background:#9ab7a8}#browserbar span{margin-left:14px}iframe{border:0;display:block;width:1600px;height:602px;transform:scale(1.125);transform-origin:0 0;background:#fff}
#captionWrap{position:absolute;left:60px;right:60px;bottom:46px;height:86px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px}#caption{font-size:31px;font-weight:500;color:#244c41;letter-spacing:.2px;text-align:center}#note{font-size:17px;color:#7c8b83;min-height:23px;text-align:center}#progress{position:absolute;left:0;bottom:0;height:5px;width:0;background:#0c7d72}#stamp{position:absolute;right:65px;bottom:15px;color:#93a099;font-size:14px;letter-spacing:1px}
#cursor{position:absolute;left:0;top:0;width:29px;height:38px;z-index:10;pointer-events:none;filter:drop-shadow(0 2px 3px #0003);transition:transform .48s ease-in-out;opacity:0}#cursor svg{width:29px;height:38px}#ring{position:absolute;pointer-events:none;border:4px solid #0c9d84;border-radius:14px;box-shadow:0 0 0 5px #87ddbb44;z-index:9;opacity:0;transition:opacity .25s}
#coverButton{display:none;position:absolute;left:838px;top:750px;padding:18px 32px;border-radius:40px;background:#0c7d72;color:white;font-size:24px;box-shadow:0 8px 20px #0c7d7222}#repo{display:none;position:absolute;left:0;right:0;top:700px;text-align:center;font-size:28px;color:#407266;letter-spacing:1px}
body[data-mode=title] #viewer,body[data-mode=outro] #viewer{display:none}body[data-mode=title] #section,body[data-mode=outro] #section{top:220px;left:0;width:100%;text-align:center}body[data-mode=title] #title,body[data-mode=outro] #title{left:0;top:282px;width:100%;font-size:84px;line-height:1.3;text-align:center;letter-spacing:-2px}body[data-mode=title] #kicker,body[data-mode=outro] #kicker{top:524px;left:0;width:100%;max-width:none;text-align:center;font-size:29px}body[data-mode=title] #flow,body[data-mode=outro] #flow{top:641px;left:0;width:100%;justify-content:center}body[data-mode=title] #minor,body[data-mode=outro] #minor{display:none}
body[data-mode=popup] #title{top:252px;font-size:65px;line-height:1.4;max-width:780px}body[data-mode=popup] #section{top:195px}body[data-mode=popup] #kicker{top:467px;font-size:26px}body[data-mode=popup] #flow{top:609px;gap:10px}body[data-mode=popup] #flow span{font-size:22px;padding:15px}body[data-mode=popup] #viewer{top:114px;left:1090px;width:502px;height:796px}body[data-mode=popup] iframe{width:400px;height:608px;transform:scale(1.25)}body[data-mode=manager] #flow,body[data-mode=manager] #kicker,body[data-mode=manager] #minor{display:none}body[data-mode=manager] #title{font-size:36px;top:140px}
body[data-mode=outro] #flow{top:618px}body[data-mode=outro] #repo{display:block;top:739px}
#marker{position:absolute;left:0;top:0;width:8px;height:8px;background:#df00df;z-index:20}
</style>
<body data-mode="title"><header><div class="brand"><img src="/assets/logo.png">Paper_Mind</div><div class="badge">功能介绍 · 实际界面演示</div></header>
<div id="section"></div><h1 id="title"></h1><div id="kicker"></div><div id="flow"><span>脑海中的概念</span><b>→</b><span>已有标签</span><b>→</b><span>你的论文</span></div><div id="minor"><strong>轻量收藏 · 简洁管理</strong><br>标签有说明，阅读进度独立管理。<br>按需要添加标签，数量不设上限。</div>
<div id="viewer"><div id="browserbar"><i></i><i></i><i></i><span id="address">Paper_Mind · 本地论文库</span></div><iframe id="app" src="/popup.html"></iframe></div>
<div id="captionWrap"><div id="caption"></div><div id="note"></div></div><div id="progress"></div><div id="stamp">PAPER_MIND 1.5.1</div><div id="repo">github.com/ZJU-OmniAI/Paper_Mind</div><div id="coverButton">▶　观看功能介绍</div>
<div id="cursor"><svg viewBox="0 0 29 38"><path d="M3 2 L25 23 L15 24 L20 34 L14 37 L9 26 L2 32 Z" fill="#183c33" stroke="white" stroke-width="2"/></svg></div><div id="ring"></div><div id="marker"></div>
<script>
window.cue = (scene, index, total) => { document.body.dataset.mode=scene.mode; for(const field of ['section','title','kicker','caption'])document.getElementById(field).textContent=scene[field]||''; document.getElementById('note').textContent=scene.note||'演示数据 · 实际界面操作'; document.getElementById('progress').style.width=`${index/total*100}%`; document.getElementById('ring').style.opacity=0; document.getElementById('cursor').style.opacity=0; };
window.point=(x,y)=>{const el=document.getElementById('cursor');el.style.opacity=1;el.style.transform=`translate(${x}px,${y}px)`;};
window.highlight=rect=>{const el=document.getElementById('ring');Object.assign(el.style,{left:rect.x-5+'px',top:rect.y-5+'px',width:rect.width+10+'px',height:rect.height+10+'px',opacity:1});};
</script></body></html>
