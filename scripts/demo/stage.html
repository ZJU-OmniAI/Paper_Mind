<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>Paper_Mind 功能介绍录制</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:1920px;height:1080px;overflow:hidden}body{font-family:"PingFang SC",-apple-system,BlinkMacSystemFont,sans-serif;background:#f1f5f2;color:#173b35}
body:before{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at 95% 8%,#c6e9e066,transparent 50%),linear-gradient(120deg,transparent 65%,#e0ece766);pointer-events:none}
header{position:absolute;left:60px;top:26px;right:60px;display:flex;align-items:center;justify-content:space-between;height:58px}header .brand{display:flex;gap:17px;align-items:center;font-size:29px;font-weight:700;letter-spacing:.5px}header img{width:50px;height:50px;object-fit:contain}header .badge{border:1px solid #cadad3;border-radius:40px;padding:10px 18px;color:#61776f;font-size:18px;letter-spacing:1px;background:#ffffff77}

#flow{position:absolute;left:65px;top:490px;display:flex;gap:16px;align-items:center}#flow span{font-size:24px;letter-spacing:.5px;padding:18px 23px;border-radius:14px;border:1px solid #cbdcd4;background:#fff9}#flow span:first-child{border-color:#9dcfc0;background:#e4f4ed;color:#0c7d72}#flow b{color:#85ac9d;font-size:26px}
#minor{position:absolute;left:65px;bottom:215px;max-width:690px;line-height:1.8;color:#7a8d84;font-size:21px}#minor strong{color:#547269;font-weight:500}
#viewer{position:absolute;top:197px;left:60px;width:1800px;height:711px;border:1px solid #bcd5ca;border-radius:18px;background:#fff;box-shadow:0 18px 50px #29534713;overflow:hidden;opacity:1}#browserbar{height:34px;background:#e6eee9;border-bottom:1px solid #d9e4dc;display:flex;align-items:center;gap:6px;padding:0 15px;color:#6a7e75;font-size:13px}#browserbar i{height:8px;width:8px;border-radius:50%;background:#9ab7a8}#browserbar span{margin-left:14px}iframe{border:0;display:block;width:1600px;height:602px;transform:scale(1.125);transform-origin:0 0;background:#fff}
#captionWrap{position:absolute;left:60px;right:60px;bottom:46px;height:86px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px}#caption{font-size:31px;font-weight:500;color:#244c41;letter-spacing:.2px;text-align:center}#note{font-size:17px;color:#7c8b83;min-height:23px;text-align:center}#progress{position:absolute;left:0;bottom:0;height:5px;width:0;background:#0c7d72}#stamp{position:absolute;right:65px;bottom:15px;color:#93a099;font-size:14px;letter-spacing:1px}
#cursor{position:absolute;left:0;top:0;width:29px;height:38px;z-index:10;pointer-events:none;filter:drop-shadow(0 2px 3px #0003);transition:transform .48s ease-in-out;opacity:0}#cursor svg{width:29px;height:38px}#ring{position:absolute;pointer-events:none;border:4px solid #0c9d84;border-radius:14px;box-shadow:0 0 0 5px #87ddbb44;z-index:9;opacity:0;transition:opacity .25s}
#coverButton{display:none;position:absolute;left:838px;top:750px;padding:18px 32px;border-radius:40px;background:#0c7d72;color:white;font-size:24px;box-shadow:0 8px 20px #0c7d7222}#repo{display:none;position:absolute;left:0;right:0;top:700px;text-align:center;font-size:28px;color:#407266;letter-spacing:1px}
body[data-mode=title] #viewer,body[data-mode=outro] #viewer{display:none}body[data-mode=title] #section,body[data-mode=outro] #section{top:220px;left:0;width:100%;text-align:center}body[data-mode=title] #title,body[data-mode=outro] #title{left:0;top:282px;width:100%;font-size:84px;line-height:1.3;text-align:center;letter-spacing:-2px}body[data-mode=title] #kicker,body[data-mode=outro] #kicker{top:524px;left:0;width:100%;max-width:none;text-align:center;font-size:29px}body[data-mode=title] #flow,body[data-mode=outro] #flow{top:641px;left:0;width:100%;justify-content:center}body[data-mode=title] #minor,body[data-mode=outro] #minor{display:none}
body[data-mode=popup] #title{top:252px;font-size:65px;line-height:1.4;max-width:780px}body[data-mode=popup] #section{top:195px}body[data-mode=popup] #kicker{top:467px;font-size:26px}body[data-mode=popup] #flow{top:609px;gap:10px}body[data-mode=popup] #flow span{font-size:22px;padding:15px}body[data-mode=popup] #viewer{top:114px;left:1090px;width:502px;height:796px}body[data-mode=popup] iframe{width:400px;height:608px;transform:scale(1.25)}body[data-mode=manager] #flow,body[data-mode=manager] #kicker,body[data-mode=manager] #minor{display:none}body[data-mode=manager] #title{font-size:36px;top:140px}
body[data-mode=outro] #flow{top:618px}body[data-mode=outro] #repo{display:block;top:739px}
#marker{position:absolute;left:0;top:0;width:8px;height:8px;background:#df00df;z-index:20}

#viewer{height:671px}iframe{height:565px}
#captionWrap{bottom:15px;height:169px;gap:7px;left:70px;right:70px}#caption{font-size:30px;line-height:1.3;max-width:1750px}#captionSecondary{font-size:24px;line-height:1.3;max-width:1750px;color:#58766b;text-align:center}#note{font-size:15px;color:#82948a;min-height:19px}#stamp{bottom:6px;font-size:11px}
#chips{position:absolute;left:65px;top:585px;max-width:800px;display:flex;flex-wrap:wrap;gap:12px}#chips span{padding:12px 18px;border:1px solid #c5dbd1;border-radius:10px;background:#ffffffaa;font-size:22px;color:#397060}
body:not([data-mode=popup]) #chips{display:none}body[data-mode=popup] #viewer{height:742px}body[data-mode=popup] iframe{height:565px}body[data-mode=popup] #minor{display:none}body[data-mode=popup] #flow{top:719px}body[data-mode=popup] #kicker{max-width:820px}body[data-language=en][data-mode=popup] #title{font-size:61px}body[data-language=en][data-mode=popup] #kicker{font-size:27px}
body[data-mode=title] #title,body[data-mode=outro] #title{top:262px}body[data-mode=title] #kicker,body[data-mode=outro] #kicker{top:505px}body[data-mode=title] #flow,body[data-mode=outro] #flow{top:612px}body[data-mode=outro] #repo{top:729px}
#memoryStage,#recallStage{display:none;position:absolute;left:105px;right:105px;top:353px;height:438px}
body:is([data-mode=memory],[data-mode=recall]) :is(#viewer,#flow,#minor){display:none}
body:is([data-mode=memory],[data-mode=recall]) #section{top:122px;left:105px}
body:is([data-mode=memory],[data-mode=recall]) #title{top:173px;left:105px;font-size:58px;line-height:1.25}
body:is([data-mode=memory],[data-mode=recall]) #kicker{top:266px;left:105px;font-size:27px;max-width:1710px}
body[data-mode=memory] #memoryStage{display:grid;grid-template-columns:680px 1fr;gap:95px}
.faded-paper{background:#fff;border:1px solid #d0dcd6;border-radius:18px;padding:31px 36px;box-shadow:0 18px 40px #26483b0c;transform:rotate(-2deg)}
.visual-label{font-size:18px;letter-spacing:1px;color:#6b8277;font-weight:600;margin-bottom:22px}
.forgotten-title{font-size:30px;color:#8a9992;margin-bottom:22px}.blur-line{height:16px;border-radius:6px;background:#94a69b;filter:blur(4px);opacity:.25;margin:13px 0;width:92%}.blur-line.short{width:64%}
.method-sketch{display:flex;align-items:center;gap:16px;color:#a6b4ac;margin:35px 0 20px;filter:blur(2px);opacity:.45}.method-sketch span{border:2px solid #a6b4ac;border-radius:10px;padding:14px 24px;font-size:20px}
.forgotten-note{font-size:23px;color:#778c81;margin-top:27px}
.memory-notes{padding-top:20px}.memory-notes .thought{background:#fff5d9;border:1px solid #eadcb3;border-radius:8px;padding:22px 27px;margin:18px 0;font-size:29px;color:#756235;box-shadow:3px 7px 0 #d7c99220;transition:opacity .6s,transform .6s}
.memory-notes .thought:nth-child(3){margin-left:42px;transform:rotate(1deg)}.memory-notes .thought:nth-child(4){margin-right:45px;transform:rotate(-1deg)}
body[data-visual=forget] .memory-notes .thought{opacity:.18;transform:translateY(12px)}
body[data-mode=recall] #recallStage{display:grid;grid-template-columns:1fr 65px 1fr 65px 1fr;align-items:stretch;gap:0}
.recall-column{border:1px solid #c8dcd1;border-radius:18px;background:#fff9;padding:27px 25px}
.recall-column h2{margin:0 0 23px;font-size:25px;line-height:1.3;letter-spacing:-.3px}
.recall-column .step{display:block;font-size:15px;letter-spacing:2px;color:#0c8270;margin-bottom:11px}
.recall-item{display:flex;align-items:center;min-height:73px;border:1px solid #d8e5dd;border-radius:11px;margin:12px 0;padding:12px 17px;font-size:23px;line-height:1.35;background:#fff}
.recall-column.impressions .recall-item{background:#fff6df;border-color:#ebdfbc;color:#776335;font-size:23px}
.recall-column.tags .recall-item{background:#e8f6ef;color:#0a7c6a;border-color:#b6dccc;font-weight:600}
.recall-column.papers .recall-item{font-size:20px;min-height:86px;transition:opacity .6s,transform .6s}
.recall-hint{font-size:17px;line-height:1.45;color:#637f70;margin-top:19px}
.recall-arrow{display:flex;align-items:center;justify-content:center;font-size:42px;color:#68a58c}
body[data-visual=connect] .recall-column.papers .recall-item{opacity:.2;transform:translateX(12px)}
body[data-mode=recall] #coverButton{top:842px;padding:10px 27px;font-size:20px}
body[data-language=en] .memory-notes .thought{font-size:27px}
body[data-language=en] .recall-column h2{font-size:24px}
body[data-language=en] .recall-column.impressions .recall-item{font-size:22px}
</style>
<body data-mode="title"><header><div class="brand"><img src="/assets/logo.png">Paper_Mind</div><div class="badge" id="badge">功能全景 · 实际界面</div></header>
<div id="section"></div><h1 id="title"></h1><div id="kicker"></div><div id="flow"><span>脑海中的概念</span><b>→</b><span>已有标签</span><b>→</b><span>你的论文</span></div><div id="chips"></div><div id="minor"><strong>轻量收藏 · 简洁管理</strong><br>标签有说明，阅读进度独立管理。<br>按需要添加标签，数量不设上限。</div>
<div id="viewer"><div id="browserbar"><i></i><i></i><i></i><span id="address">Paper_Mind · 本地论文库</span></div><iframe id="app" src="/popup.html"></iframe></div>
<div id="memoryStage"></div><div id="recallStage"></div>
<div id="captionWrap"><div id="caption"></div><div id="captionSecondary"></div><div id="note"></div></div><div id="progress"></div><div id="stamp">PAPER_MIND 1.5.1</div><div id="repo">github.com/ZJU-OmniAI/Paper_Mind</div><div id="coverButton">▶　观看功能介绍</div>
<div id="cursor"><svg viewBox="0 0 29 38"><path d="M3 2 L25 23 L15 24 L20 34 L14 37 L9 26 L2 32 Z" fill="#183c33" stroke="white" stroke-width="2"/></svg></div><div id="ring"></div><div id="marker"></div>
<script>
const element=(tag,text,className)=>{const el=document.createElement(tag);el.textContent=text;el.className=className||'';return el;};
window.drawRecall=language=>{
  const en=language==='en',pick=(zh,english)=>en?english:zh;
  const thoughts=pick(['让模型先查点资料…','好像会自己调用工具…','回答能不能更靠谱？'],['A model that looks things up…','Something about using tools…','Can the answers be more reliable?']);
  const paper=element('div','','faded-paper');
  paper.append(element('div',pick('读过的那篇论文','THE PAPER YOU READ'),'visual-label'),element('div',pick('标题是什么来着？','What was the title?'),'forgotten-title'),element('div','','blur-line'),element('div','','blur-line short'));
  const method=element('div','','method-sketch');for(const word of ['Input','→','Model','→','Output'])method.append(element(word==='→'?'b':'span',word));
  paper.append(method,element('div','','blur-line'),element('div',pick('具体方法、实现细节，也想不起来了。','The method and its details are hazy too.'),'forgotten-note'));
  const notes=element('div','','memory-notes');notes.append(element('div',pick('脑海里留下的，只是一些粗略印象','ALL YOU RECALL: A FEW ROUGH IMPRESSIONS'),'visual-label'));thoughts.forEach(t=>notes.append(element('div',t,'thought')));
  document.getElementById('memoryStage').replaceChildren(paper,notes);
  const columns=[
    {kind:'impressions',title:pick('模糊印象','A vague impression'),items:thoughts,hint:pick('不必先想起准确标题或方法名称。','No exact title or method name needed.')},
    {kind:'tags',title:pick('已有标签','Existing tags'),items:pick(['检索增强生成','智能体','评估与可靠性'],['Retrieval-augmented generation','Agents','Evaluation']),hint:pick('复用名称、别名与说明；模糊描述可用 AI 辅助匹配。','Reuse names, aliases and descriptions. AI can help with vague phrasing.')},
    {kind:'papers',title:pick('你收藏的论文','Your saved papers'),items:['Grounded Answers with Retrieval-Augmented Generation','Tool Selection for Research Agents','When Retrieved Evidence Disagrees'],hint:pick('沿着标签缩小范围，重新找到它。','Follow the tags to narrow your search.')}
  ];
  const parts=[];columns.forEach((c,i)=>{if(i)parts.push(element('div','→','recall-arrow'));const col=element('div','',`recall-column ${c.kind}`);col.append(element('span',`0${i+1}`,'step'),element('h2',c.title));c.items.forEach(t=>col.append(element('div',t,'recall-item')));col.append(element('div',c.hint,'recall-hint'));parts.push(col);});
  document.getElementById('recallStage').replaceChildren(...parts);
};
window.cue = (scene, index, total, language='zh') => {
  const en=language==='en', i=en?1:0;
  document.body.dataset.mode=scene.mode; document.body.dataset.language=language;document.body.dataset.visual='';
  if(['memory','recall'].includes(scene.mode))window.drawRecall(language);
  for(const field of ['section','title','kicker'])document.getElementById(field).textContent=scene[field]?.[i]||'';
  document.getElementById('caption').textContent='';document.getElementById('captionSecondary').textContent='';
  document.getElementById('note').textContent=en?'Demo library · AI examples are prewritten · No live model calls':'示例论文库 · AI 内容为预置演示 · 未调用在线模型';
  if(['memory','recall'].includes(scene.mode))document.getElementById('note').textContent=en?'Concept illustration · Match existing tags · Search your own collection':'流程示意 · 匹配已有标签 · 查找自己的收藏';
  document.getElementById('badge').textContent=en?'FEATURE OVERVIEW · REAL INTERFACE':'功能全景 · 实际界面';
  document.getElementById('address').textContent=en?'Paper_Mind · Local paper library':'Paper_Mind · 本地论文库';
  document.getElementById('chips').replaceChildren(...(scene.chips?.[i]||[]).map(text=>{const el=document.createElement('span');el.textContent=text;return el;}));
  const flow=en?['Remembered ideas','Existing tags','Your papers']:['脑海中的概念','已有标签','你的论文'];
  document.querySelectorAll('#flow span').forEach((el,index)=>el.textContent=flow[index]);
  document.getElementById('progress').style.width=`${index/total*100}%`; document.getElementById('ring').style.opacity=0; document.getElementById('cursor').style.opacity=0;
};
window.subtitles=(beat,language)=>{document.getElementById('caption').textContent=beat[language];document.getElementById('captionSecondary').textContent=beat[language==='zh'?'en':'zh'];document.body.dataset.visual=beat.visual||'';};
window.point=(x,y)=>{const el=document.getElementById('cursor');el.style.opacity=1;el.style.transform=`translate(${x}px,${y}px)`;};
window.highlight=rect=>{const el=document.getElementById('ring');Object.assign(el.style,{left:rect.x-5+'px',top:rect.y-5+'px',width:rect.width+10+'px',height:rect.height+10+'px',opacity:1});};
</script></body></html>
